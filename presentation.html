<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Retail Sales, Inventory & Business Performance Analysis presentation">
  <title>Retail Sales, Inventory &amp; Business Performance Analysis</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f3f5f8;
    }
    header {
      padding: 1rem clamp(1rem, 4vw, 3rem);
      background: #fff;
      border-bottom: 1px solid #dfe4ec;
    }
    h1 { margin: 0; font-size: clamp(1.1rem, 2.5vw, 1.6rem); }
    main { flex: 1; display: flex; flex-direction: column; padding: 1rem; }
    .actions { margin: 0 auto 1rem; width: min(100%, 1200px); }
    a { color: #1457b8; }
    .viewer {
      flex: 1;
      width: min(100%, 1200px);
      min-height: 70vh;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
      border: 1px solid #dfe4ec;
      border-radius: 8px;
      box-shadow: 0 4px 18px rgb(20 32 51 / 8%);
    }
    iframe { display: block; width: 100%; height: 75vh; min-height: 560px; border: 0; }
    footer { padding: .8rem 1rem; text-align: center; color: #5b6472; font-size: .9rem; }
    @media (max-width: 600px) {
      main { padding: .75rem; }
      iframe { height: 72vh; min-height: 420px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Retail Sales, Inventory &amp; Business Performance Analysis</h1>
  </header>
  <main>
    <p class="actions">
      If the embedded presentation does not load, <a id="download" href="#">open or download the PowerPoint file</a>.
    </p>
    <section class="viewer" aria-label="PowerPoint presentation viewer">
      <iframe id="presentation" title="Retail Sales, Inventory &amp; Business Performance Analysis presentation" allowfullscreen></iframe>
    </section>
  </main>
  <footer>Presentation displayed using Microsoft Office for the web.</footer>
  <script>
    const presentationUrl = "https://raw.githubusercontent.com/martinmragui-prog/Gen-Data-Capstone/main/PowerPoint%20Slides/Retail%20Sales%2C%20Inventory%20%26%20Business%20Performance%20Analysis.pptx";
    document.getElementById("presentation").src =
      "https://view.officeapps.live.com/op/embed.aspx?src=" + encodeURIComponent(presentationUrl);
    document.getElementById("download").href = presentationUrl;
  </script>
</body>
</html>
